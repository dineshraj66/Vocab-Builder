<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Vocab Trainer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Auth Overlay -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1>Daily Vocab Trainer</h1>
      <p>365-Day Newspaper Sentence & Spaced Repetition System</p>
      <button id="google-signin-btn" class="btn btn-primary">Sign in with Google</button>
      <p id="auth-error" class="error-text"></p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-container" class="app-container hidden">
    <header class="topbar">
      <div class="brand">
        <h2>Vocab Trainer</h2>
        <span id="user-email" class="badge"></span>
      </div>
      <div class="top-actions">
        <button id="open-calendar-btn" class="btn btn-secondary calendar-trigger" title="Practice Calendar & Streak">
          📅 <span id="header-streak">0</span>
        </button>
        <button id="open-import-btn" class="btn btn-primary">+ Import JSON</button>
        <button id="export-backup-btn" class="btn btn-secondary">Backup</button>
        <button id="signout-btn" class="btn btn-ghost">Sign Out</button>
      </div>
    </header>

    <!-- Stats Bar -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Due Today</span>
        <strong id="stat-due" class="stat-value accent">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Words</span>
        <strong id="stat-total" class="stat-value">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Mastered (Box 4+)</span>
        <strong id="stat-mastered" class="stat-value success">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">Current Streak</span>
        <strong id="stat-streak" class="stat-value warning">0d</strong>
      </div>
    </section>

    <!-- Navigation Tabs -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="study-tab">Study Queue</button>
      <button class="tab-btn" data-tab="bank-tab">Word Bank</button>
    </nav>

    <!-- Tab 1: Study Queue -->
    <main id="study-tab" class="tab-content active">
      <div id="empty-queue" class="empty-state hidden">
        <h3>All caught up for today!</h3>
        <p>You have reviewed every card due today. Import tomorrow's sentences or browse your Word Bank.</p>
        <button id="practice-all-btn" class="btn btn-secondary">Practice Ahead (Extra Review)</button>
      </div>

      <div id="flashcard-wrapper" class="flashcard-wrapper hidden">
        <div class="card-meta">
          <span id="card-source"
